name: CI

on:
  push:
    branches: 
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop  

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r startup_gateway/requirements.txt
          pip install -r startup_gateway/requirements-dev.txt

      - name: Run backend linters
        id: backend_lint
        working-directory: startup_gateway
        continue-on-error: true
        run: |
          set +e
          black --check .
          isort --check-only
          pylint .
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "::error::❌ Backend lint failed. Run flake8, isort and pylint locally to see details."
          fi 

      
      - name: Run Django migrations
        working-directory: startup_gateway
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          MONGO_HOST: localhost
          MONGO_PORT: 27017
          MONGO_DB_NAME: startup_gateway_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
        run: |
          python manage.py migrate --noinput

      
      - name: Create MongoDB indexes
        working-directory: startup_gateway
        env:
          MONGO_HOST: localhost
          MONGO_PORT: 27017
          MONGO_DB_NAME: startup_gateway_test
        run: |
          python manage.py create_mongo_indexes

      
      - name: Run tests with coverage
        working-directory: startup_gateway
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          MONGO_HOST: localhost              
          MONGO_PORT: 27017                   
          MONGO_DB_NAME: startup_gateway_test 
          MEILI_HOST: http://meilisearch:7700
          MEILI_MASTER_KEY: masterKey
          REDIS_URL: redis://localhost:6379/0 
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "True"                       
        run: |
          pytest --cov --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./startup_gateway/coverage.xml  
          fail_ci_if_error: false
                   

  frontend:
    name: frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend linters
        working-directory: frontend
        continue-on-error: true
        run: |
          set +e
          npm run lint
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "::error::❌ Frontend lint failed. Run 'npm run lint' locally to see details."
          fi 

      - name: Run frontend build 
        working-directory: frontend
        run: npm run build