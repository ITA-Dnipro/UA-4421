version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: startup_gateway_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      # Optional: Uncomment to enable authentication
      # MONGO_INITDB_ROOT_USERNAME: admin
      # MONGO_INITDB_ROOT_PASSWORD: admin_password
      MONGO_INITDB_DATABASE: startup_gateway
    volumes:
      # Persist data
      - mongodb_data:/data/db
      # Optional: Initialize scripts
      # - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - startup_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Optional: MongoDB Express for GUI management
  mongo-express:
    image: mongo-express:latest
    container_name: startup_gateway_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      # If MongoDB has authentication, uncomment:
      # ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      # ME_CONFIG_MONGODB_ADMINPASSWORD: admin_password
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: pass
    depends_on:
      - mongodb
    networks:
      - startup_network

volumes:
  mongodb_data:
    driver: local

networks:
  startup_network:
    driver: bridge
