services:
  backend:
    build:
      context: ./startup_gateway
      dockerfile: Dockerfile.backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./startup_gateway:/app
    ports:
      - "8000:8000"
    env_file:
      - ./startup_gateway/.env.docker
    depends_on:
      - db
      - redis
      - mongodb
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://backend:8000

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: startup_db
      POSTGRES_USER: startup_user
      POSTGRES_PASSWORD: startup_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
  
  mongodb:
    image: mongo:7.0
    container_name: startup_gateway_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: startup_gateway
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    
  mongo-express:
    image: mongo-express:latest
    container_name: startup_gateway_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: pass
    depends_on:
      - mongodb
volumes:
  postgres_data:
  mongodb_data:
